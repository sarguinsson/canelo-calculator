# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy static web app to Azure Web App - canelo-calculator

on:
  push:
    branches:
      - copilot/add-canelon-calculator-page
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Prepare static files for deployment
        run: |
          echo "Static HTML site - no build required"
          ls -la

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: static-app
          path: |
            *.html
            *.css
            *.js
            web.config

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: static-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51B1975A116240B4B99D72CDC3EA3F08 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_964F3D3C0ADA445D9726E5DC1DACD9DA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96112EFBE3694146A12254012F455686 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'canelo-calculator'
          slot-name: 'Production'
          package: .
          